
<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Fluidium ULTRA – Accessible, robust virtual fluid mechanics lab." />
  <meta name="theme-color" content="#1F77B4" />
  <title>Fluidium ULTRA</title>
  <link rel="icon" type="image/png" href="/logo192.png" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    (() => {
      const theme = localStorage.getItem('theme') || 'light';
      document.documentElement.classList.remove('light', 'dark');
      document.documentElement.classList.add(theme);
    })();
  </script>
  <script>
    (function(){
      function show(msg){
        var d=document.createElement('div');
        d.setAttribute('role','alert');
        d.style.position='fixed'; d.style.zIndex='99999';
        d.style.left='0'; d.style.right='0'; d.style.bottom='0';
        d.style.padding='12px 16px'; d.style.background='rgba(220,38,38,0.95)';
        d.style.color='white'; d.style.fontFamily='monospace'; d.style.fontSize='12px';
        d.textContent='Fluidium Runtime Error: ' + msg;
        document.body.appendChild(d);
        setTimeout(()=>{ d.remove(); }, 8000);
      }
      window.addEventListener('error', function(e){ show(e.message); });
      window.addEventListener('unhandledrejection', function(e){ show((e.reason && e.reason.message) || 'Unhandled Promise Rejection'); });
    })();
  </script>
</head>
<body class="min-h-screen font-sans bg-bg-light dark:bg-bg-dark text-gray-900 dark:text-gray-100">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 bg-primary text-white px-3 py-2 rounded">Skip to content</a>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
