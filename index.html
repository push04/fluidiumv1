
<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluidium</title>
  <meta name="theme-color" content="#0ea5e9" />
  <link rel="icon" href="/logo.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <script>
    (() => { const t = localStorage.getItem('theme') || 'light'; document.documentElement.classList.add(t); })();
  </script>
  <script>
    // Runtime error overlay so blank screens are avoided
    (function(){
      function show(msg){
        var d=document.createElement('div');
        d.setAttribute('role','alert');
        d.style.position='fixed'; d.style.zIndex='99999';
        d.style.left='0'; d.style.right='0'; d.style.bottom='0';
        d.style.padding='10px 14px'; d.style.background='rgba(220,38,38,0.95)';
        d.style.color='white'; d.style.fontFamily='monospace'; d.style.fontSize='12px';
        d.textContent='Fluidium Error: ' + msg;
        document.body.appendChild(d);
        setTimeout(()=>{ d.remove(); }, 8000);
      }
      window.addEventListener('error', (e)=>show(e.message));
      window.addEventListener('unhandledrejection', (e)=>show((e.reason&&e.reason.message)||'Unhandled Rejection'));
    })();
  </script>
</head>
<body class="min-h-screen bg-surface-light dark:bg-surface-dark text-gray-900 dark:text-gray-100 font-[Inter]">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 bg-primary text-white px-3 py-2 rounded">Skip to content</a>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
